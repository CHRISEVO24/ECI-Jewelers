# Netlify build config
# Before deploying, fetches the latest history.json from GitHub Releases
# so the dashboard always shows the most recent inventory data.
# Netlify only pulls this at build time — i.e. only when a new commit
# lands in the repo (the scraper's daily run), not on a live poll.

[build]
  command   = "node fetch-history.js"
  publish   = "."

[[redirects]]
  from = "/"
  to   = "/dashboard.html"
  status = 200
